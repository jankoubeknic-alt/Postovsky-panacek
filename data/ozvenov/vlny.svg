<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" preserveAspectRatio="xMidYMid slice">
  <!-- Ozvěna právě něco nese: vlny z lomu se šíří do údolí -->
  <style>
    .v { animation: sir 2s ease-out infinite; transform-origin: 150px 64px; opacity: 0; }
    .v2 { animation-delay: -.7s; } .v3 { animation-delay: -1.4s; }
    @keyframes sir { 0% { transform: scale(.6); opacity: .8; } 100% { transform: scale(1.8); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .v { animation: none; opacity: .5; } }
  </style>
  <g fill="none" stroke="#5B4A6E" stroke-width="2.5" stroke-linecap="round">
    <path class="v" d="M110 64a40 40 0 0 1 0-0.1M100 80q-20-16 0-32M200 80q20-16 0-32"/>
    <path class="v v2" d="M100 80q-20-16 0-32M200 80q20-16 0-32"/>
    <path class="v v3" d="M100 80q-20-16 0-32M200 80q20-16 0-32"/>
  </g>
</svg>
