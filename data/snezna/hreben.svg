<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" preserveAspectRatio="xMidYMid slice">
  <!-- Druhá scéna, hřeben: vlevo babiččina chalupa, vpravo nahoře meteorologická stanice na vrcholu,
       uprostřed horská chata, dole konec stezky a horní stanice lanovky. Celá zakryje údolí. -->
  <rect width="300" height="400" fill="#A9BFD1"/>
  <path d="M-10 130L40 90L90 120L140 70L190 104L230 40L270 70L310 60V400H-10Z" fill="#DCE6EE"/>
  <path d="M230 40L252 66L238 64L234 84L220 58Z" fill="#B3C5D4"/>
  <path d="M140 70L160 94L148 92L144 110L132 86Z" fill="#B3C5D4"/>
  <path d="M-10 170C50 150 110 166 170 156S260 146 310 160V400H-10Z" fill="#F4F6F8"/>

  <!-- meteorologická stanice na vrcholu -->
  <rect x="206" y="58" width="44" height="40" fill="#C9C2B4"/>
  <path d="M200 60L228 42L256 60Z" fill="#FFFFFF" stroke="#8A8378" stroke-width="1.5"/>
  <path d="M250 58V18M250 18l-8 6M250 18l8 6" stroke="#4A4542" stroke-width="2" fill="none"/>
  <g fill="#4A4542"><circle cx="242" cy="24" r="2.5"/><circle cx="258" cy="24" r="2.5"/></g>
  <rect x="214" y="70" width="12" height="12" fill="#8FB3C6" stroke="#4A4542" stroke-width="1.5"/>

  <!-- babiččina chalupa -->
  <rect x="28" y="110" width="88" height="56" fill="#8A6A4A"/>
  <g stroke="#6B4F35" stroke-width="2"><path d="M28 122H116M28 134H116M28 146H116M28 158H116"/></g>
  <path d="M18 114L72 78L126 114Z" fill="#FFFFFF" stroke="#B3C5D4" stroke-width="2"/>
  <rect x="96" y="84" width="10" height="18" fill="#6B4F35"/>
  <rect x="44" y="128" width="16" height="16" fill="#F2C86A" stroke="#4A3A2A" stroke-width="2"/>
  <rect x="84" y="128" width="16" height="16" fill="#F2C86A" stroke="#4A3A2A" stroke-width="2"/>
  <g fill="#6B4F35"><rect x="124" y="150" width="20" height="16"/><rect x="128" y="142" width="12" height="8"/></g>

  <!-- horská chata -->
  <rect x="124" y="196" width="128" height="72" fill="#A0785A"/>
  <rect x="124" y="242" width="128" height="26" fill="#8F8A82"/>
  <path d="M112 200L188 156L264 200Z" fill="#FFFFFF" stroke="#B3C5D4" stroke-width="2"/>
  <rect x="140" y="268" width="96" height="6" fill="#FFFFFF"/>
  <g fill="#F2C86A" stroke="#4A3A2A" stroke-width="2"><rect x="136" y="210" width="18" height="18"/><rect x="222" y="210" width="18" height="18"/></g>
  <rect x="150" y="182" width="76" height="10" fill="#3B332E"/>
  <text x="188" y="190" font-family="Georgia, serif" font-size="6.5" letter-spacing="1" fill="#F4F6F8" text-anchor="middle">CHATA NA HŘEBENI</text>

  <!-- konec stezky a ukazatel -->
  <path d="M20 400C40 370 26 344 52 320" fill="none" stroke="#D9E1E8" stroke-width="14" stroke-linecap="round"/>
  <path d="M86 352V306" stroke="#6B4A36" stroke-width="3"/>
  <path d="M86 308h-26l-6 6 6 6h26z" fill="#E2B23A"/>

  <!-- horní stanice lanovky -->
  <path d="M262 340L320 420" stroke="#4A4542" stroke-width="1.5"/>
  <path d="M248 340L306 420" stroke="#4A4542" stroke-width="1.5"/>
  <rect x="222" y="300" width="70" height="44" fill="#9A9690"/>
  <path d="M216 302L257 280L298 302Z" fill="#FFFFFF" stroke="#7A6A5A" stroke-width="1.5"/>
  <circle cx="257" cy="300" r="9" fill="none" stroke="#4A4542" stroke-width="2.5"/>

  <!-- smrčky a závěje -->
  <g fill="#3F5E52"><path d="M6 200L18 164L30 200Z"/><path d="M268 196L282 156L296 196Z"/><path d="M104 300L116 266L128 300Z"/></g>
  <path d="M-10 376C50 364 90 384 140 372S240 362 310 378V400H-10Z" fill="#FFFFFF"/>
</svg>
