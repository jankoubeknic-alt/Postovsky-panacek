<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" preserveAspectRatio="xMidYMid slice">
  <!-- Zástupné pozadí Sněžné, údolí: nahoře pošta s okénkem poštmistra, před ní pult se zásilkami,
       vlevo dole začátek stezky na hřeben, uprostřed zastávka, vpravo dole dolní stanice lanovky. -->
