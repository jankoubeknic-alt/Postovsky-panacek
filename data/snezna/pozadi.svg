  <path d="M66 76L150 24L234 76L226 76L150 32L74 76Z" fill="#FFFFFF"/>
  <path d="M70 74Q150 64 230 74L234 80H66Z" fill="#FFFFFF"/>
  <rect x="196" y="34" width="12" height="26" fill="#7A6A5A"/>
  <g fill="#E8ECEF" opacity=".85"><circle cx="204" cy="26" r="7"/><circle cx="212" cy="14" r="8"/><circle cx="222" cy="4" r="7"/></g>
  <rect x="118" y="66" width="64" height="48" fill="#F2C86A" stroke="#5A3E2B" stroke-width="3"/>
  <rect x="104" y="118" width="92" height="13" fill="#E2B23A"/>
  <text x="150" y="128" font-family="Georgia, serif" font-size="9" letter-spacing="3" fill="#3B2A1E" text-anchor="middle">POŠTA</text>
  <g fill="#8FB3C6" stroke="#5A3E2B" stroke-width="2"><rect x="88" y="86" width="20" height="24"/><rect x="192" y="86" width="20" height="24"/></g>

  <!-- pult se zásilkami -->
  <rect x="14" y="214" width="272" height="10" fill="#8A6A4A"/>
  <path d="M14 214h272" stroke="#FFFFFF" stroke-width="3"/>
  <g fill="#6B4A36"><rect x="22" y="224" width="6" height="24"/><rect x="272" y="224" width="6" height="24"/><rect x="146" y="224" width="6" height="24"/></g>

  <!-- stezka na hřeben -->
  <path d="M30 400C50 360 20 330 54 300S20 240 40 210" fill="none" stroke="#D9E1E8" stroke-width="14" stroke-linecap="round"/>
  <g fill="#B9C9D6"><circle cx="40" cy="380" r="2"/><circle cx="50" cy="350" r="2"/><circle cx="36" cy="320" r="2"/></g>
  <path d="M82 344V300" stroke="#6B4A36" stroke-width="3"/>
  <path d="M82 302h26l6 6-6 6H82z" fill="#E2B23A"/>

