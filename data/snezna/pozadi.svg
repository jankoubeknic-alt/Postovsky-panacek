  <g fill="#5E6E76"><rect x="116" y="306" width="4" height="40"/><rect x="180" y="306" width="4" height="40"/></g>
  <path d="M200 350V296" stroke="#5E6E76" stroke-width="2"/>
  <circle cx="200" cy="292" r="7" fill="#E2B23A" stroke="#5E6E76" stroke-width="1.5"/>

  <!-- dolní stanice lanovky -->
  <path d="M262 300L320 120" stroke="#4A4542" stroke-width="1.5"/>
  <path d="M248 300L306 120" stroke="#4A4542" stroke-width="1.5"/>
