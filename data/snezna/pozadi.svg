  <!-- smrky -->
  <g fill="#3F5E52">
    <path d="M14 196L30 150L46 196Z"/><path d="M262 186L278 138L294 186Z"/><path d="M40 200L52 166L64 200Z"/>
  </g>
  <g fill="#FFFFFF"><path d="M24 168l6-18 6 18-6-4z"/><path d="M272 156l6-18 6 18-6-4z"/></g>

  <!-- pošta -->
  <rect x="78" y="70" width="144" height="108" fill="#B8865A"/>
  <rect x="78" y="140" width="144" height="38" fill="#9A9690"/>
