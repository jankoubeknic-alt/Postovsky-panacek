<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" preserveAspectRatio="xMidYMid slice">
  <!-- Pořád sněží: dva vzory vloček se posouvají o jednu periodu dolů, smyčka nemá švy -->
  <style>
    .vlocky { animation: pad 6s linear infinite; }
    .vlocky2 { animation-duration: 9s; }
    @keyframes pad { from { transform: translateY(-60px); } to { transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { .vlocky { animation: none; } }
  </style>
  <defs>
    <pattern id="v1" width="50" height="60" patternUnits="userSpaceOnUse">
      <g fill="#FFFFFF" opacity=".85"><circle cx="8" cy="10" r="1.6"/><circle cx="32" cy="24" r="1.3"/><circle cx="20" cy="46" r="1.8"/><circle cx="44" cy="52" r="1.2"/></g>
    </pattern>
    <pattern id="v2" width="70" height="60" patternUnits="userSpaceOnUse">
      <g fill="#FFFFFF" opacity=".6"><circle cx="14" cy="18" r="1"/><circle cx="50" cy="8" r="1.1"/><circle cx="36" cy="40" r=".9"/><circle cx="62" cy="50" r="1"/></g>
    </pattern>
  </defs>
  <rect class="vlocky" width="300" height="460" fill="url(#v1)"/>
  <rect class="vlocky vlocky2" width="300" height="460" fill="url(#v2)"/>
</svg>
