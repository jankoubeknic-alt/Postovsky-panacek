<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" preserveAspectRatio="xMidYMid slice">
  <!-- Zástupné pozadí Kamenice: vlevo ředitelství s dalekohledem na střeše, uprostřed věž s hodinami a hospoda U Kahanu,
       vpravo těžní věž šachty, dole trafika, Frantův domek a náměstí. Postavy stojí na místech z cile.csv. -->
  <rect width="300" height="400" fill="#CDD3CF"/>
  <rect y="70" width="300" height="60" fill="#D8D4C7"/>
  <!-- haldy a vzdálené střechy -->
  <path d="M-10 132L34 86L84 132Z" fill="#5C5753"/>
  <path d="M160 132L196 92L236 132Z" fill="#4F4A47"/>
  <path d="M236 132L268 104L310 132Z" fill="#66605B"/>
  <path d="M0 132h300v18H0Z" fill="#A9A397"/>
  <g fill="#9A9488"><path d="M4 132l12-10 12 10z"/><path d="M178 132l10-8 10 8z"/><path d="M270 132l12-10 12 10z"/></g>

  <!-- věž s hodinami -->
  <rect x="134" y="28" width="32" height="160" fill="#CBB89A"/>
  <rect x="156" y="28" width="10" height="160" fill="#B5A283"/>
  <path d="M130 30L150 2L170 30Z" fill="#4E4540"/>
  <circle cx="150" cy="52" r="12" fill="#F2EAD7" stroke="#3B332E" stroke-width="2"/>
  <path d="M150 52V44M150 52l6 3" stroke="#3B332E" stroke-width="1.6" stroke-linecap="round"/>
  <rect x="144" y="86" width="12" height="18" rx="6" fill="#5D5650"/>
  <rect x="144" y="120" width="12" height="18" rx="6" fill="#5D5650"/>

  <!-- ředitelství dolu -->
  <rect x="4" y="116" width="122" height="94" fill="#D9C9A8"/>
  <rect x="4" y="108" width="122" height="10" fill="#A8977A"/>
  <path d="M4 108h122" stroke="#7D6D58" stroke-width="2"/>
  <g stroke="#7D6D58" stroke-width="1.5"><path d="M10 100v8M30 100v8M50 100v8M70 100v8M90 100v8M110 100v8M120 100v8"/><path d="M8 101h116"/></g>
  <text x="65" y="115.5" font-family="Georgia, serif" font-size="6.5" letter-spacing="1.2" fill="#4A3F33" text-anchor="middle">ŘEDITELSTVÍ</text>
  <g fill="#5D6B72" stroke="#F0E7D4" stroke-width="2">
    <rect x="12" y="130" width="16" height="22"/><rect x="102" y="130" width="16" height="22"/>
    <rect x="44" y="134" width="44" height="34"/>
    <rect x="12" y="170" width="16" height="22"/><rect x="102" y="170" width="16" height="22"/>
  </g>
  <rect x="56" y="184" width="20" height="26" fill="#6B4A36"/>
  <!-- dalekohled na střeše: nápověda už ve dne -->
  <g stroke="#4A3F33" stroke-width="1.6" stroke-linecap="round">
    <path d="M106 100l4-12 4 12M110 88v12"/>
  </g>
  <rect x="100" y="80" width="22" height="6" rx="2" transform="rotate(28 110 86)" fill="#B08A3E" stroke="#4A3F33" stroke-width="1"/>

  <!-- těžní věž šachty a strojovna -->
  <rect x="284" y="56" width="11" height="100" fill="#8C4636"/>
  <path d="M296 200L258 70" stroke="#6B3F33" stroke-width="5"/>
  <g stroke="#6B3F33" stroke-width="3.5" fill="none">
    <path d="M220 200V40M256 200V40"/>
    <path d="M220 40L256 66L220 92L256 118L220 144L256 170L220 196"/>
    <path d="M256 40L220 66L256 92L220 118L256 144L220 170L256 196"/>
  </g>
  <rect x="212" y="36" width="52" height="7" fill="#5A342B"/>
  <circle cx="238" cy="24" r="15" fill="none" stroke="#4A2E27" stroke-width="3.5"/>
  <path d="M238 9v30M223 24h30M227 13l22 22M249 13l-22 22" stroke="#4A2E27" stroke-width="1.5"/>
  <circle cx="238" cy="24" r="3" fill="#4A2E27"/>
  <rect x="262" y="152" width="38" height="56" fill="#A2543F"/>
  <path d="M258 154L280 140L304 154Z" fill="#5E4A3E"/>
  <rect x="270" y="166" width="10" height="14" fill="#5D6B72" stroke="#E9DEC8" stroke-width="1.5"/>
  <g fill="#E9E6DF" opacity=".75"><circle cx="292" cy="48" r="7"/><circle cx="284" cy="36" r="9"/><circle cx="294" cy="22" r="8"/></g>

  <!-- hospoda U Kahanu -->
  <rect x="104" y="196" width="92" height="56" fill="#E2D6BD"/>
  <path d="M96 200L150 170L204 200Z" fill="#7C3A2C"/>
  <g fill="#5D6B72" stroke="#6B4A36" stroke-width="2"><rect x="108" y="208" width="16" height="16"/><rect x="176" y="208" width="16" height="16"/></g>
  <rect x="140" y="222" width="20" height="30" fill="#6B4A36"/>
  <rect x="124" y="184" width="52" height="11" fill="#3B332E"/>
  <text x="150" y="192.5" font-family="Georgia, serif" font-size="7" letter-spacing=".8" fill="#EDD9A8" text-anchor="middle">U KAHANU</text>
  <path d="M196 212h6v6" stroke="#3B332E" stroke-width="1.5" fill="none"/>
  <path d="M199 218l4 0 1 8h-6z" fill="#3B332E"/>

  <!-- ulice a náměstí -->
  <path d="M0 250h300v150H0Z" fill="#B3A891"/>
  <g fill="#9C917B">
    <circle cx="20" cy="330" r="3"/><circle cx="44" cy="346" r="3"/><circle cx="112" cy="340" r="3"/><circle cx="128" cy="362" r="3"/>
    <circle cx="176" cy="338" r="3"/><circle cx="196" cy="362" r="3"/><circle cx="228" cy="334" r="3"/><circle cx="262" cy="350" r="3"/>
    <circle cx="286" cy="330" r="3"/><circle cx="30" cy="378" r="3"/><circle cx="76" cy="390" r="3"/><circle cx="214" cy="388" r="3"/>
    <circle cx="268" cy="384" r="3"/><circle cx="96" cy="364" r="3"/><circle cx="244" cy="366" r="3"/><circle cx="60" cy="320" r="3"/>
  </g>
  <ellipse cx="150" cy="372" rx="34" ry="10" fill="#C9BFA6"/>

  <!-- trafika -->
  <rect x="26" y="246" width="80" height="66" fill="#5F7D5B"/>
  <path d="M18 234h96l-6 14H24Z" fill="#E8DCC2"/>
  <g fill="#B0493A"><path d="M18 234h12l-1 14h-5z"/><path d="M42 234h12l-1 14h-10z"/><path d="M66 234h12l-1 14h-10z"/><path d="M90 234h12l1 14h-10z"/></g>
  <rect x="34" y="226" width="64" height="9" fill="#3B332E"/>
  <text x="66" y="233" font-family="Georgia, serif" font-size="6.5" letter-spacing="1.5" fill="#EDD9A8" text-anchor="middle">TRAFIKA</text>
  <rect x="38" y="256" width="56" height="34" fill="#5D6B72" stroke="#E8DCC2" stroke-width="2"/>
  <g fill="#EFE8D6"><rect x="30" y="294" width="10" height="14"/><rect x="92" y="294" width="10" height="14"/></g>

  <!-- pouliční lampa -->
  <path d="M128 330V256" stroke="#3B332E" stroke-width="3"/>
  <path d="M122 246h12l-2 10h-8z" fill="#3B332E"/>
  <rect x="124" y="248" width="8" height="7" fill="#D8D0B6"/>

  <!-- Frantův domek -->
  <rect x="192" y="236" width="104" height="74" fill="#CFC3AB"/>
  <path d="M184 240L244 206L304 240Z" fill="#5E4A3E"/>
  <rect x="272" y="210" width="9" height="20" fill="#5E4A3E"/>
  <rect x="216" y="246" width="36" height="28" fill="#5D6B72"/>
  <g fill="#6C8C6A" stroke="#4E6A4C" stroke-width="1"><rect x="204" y="244" width="13" height="32"/><rect x="251" y="244" width="13" height="32"/></g>
  <rect x="270" y="278" width="18" height="32" fill="#6B4A36"/>
  <rect x="268" y="270" width="22" height="6" fill="#F3EDDF" stroke="#3B332E" stroke-width=".8"/>

  <!-- vozík s uhlím -->
  <rect x="170" y="300" width="24" height="12" fill="#4A4542"/>
  <path d="M170 300l4-6h16l4 6z" fill="#2E2B29"/>
  <g fill="#2E2B29"><circle cx="176" cy="314" r="3"/><circle cx="188" cy="314" r="3"/></g>
</svg>
