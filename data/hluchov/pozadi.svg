  <rect x="226" y="214" width="74" height="42" fill="#F2EEE4"/>
  <path d="M222 216L263 196L304 216Z" fill="#6E7F8C"/>
  <rect x="270" y="168" width="20" height="48" fill="#F2EEE4"/>
  <path d="M266 170L280 146L294 170Z" fill="#6E7F8C"/>
  <path d="M280 138v10M276 142h8" stroke="#C9A24A" stroke-width="1.6"/>
  <circle cx="280" cy="184" r="5" fill="#C9A24A"/>
  <rect x="236" y="230" width="12" height="20" rx="6" fill="#8A7A66"/>
  <!-- posed na návsi -->
  <g stroke="#7A5A3A" stroke-width="3"><path d="M222 352L232 296M262 352L252 296M226 330H258"/></g>
  <rect x="224" y="282" width="36" height="18" fill="#9C7A52"/>
  <path d="M220 284L242 270L264 284Z" fill="#6B4A36"/>
  <!-- rybník s kachnami -->
  <ellipse cx="248" cy="380" rx="50" ry="14" fill="#8DB6C2"/>
  <g fill="#F2EEE4"><ellipse cx="232" cy="378" rx="5" ry="3"/><ellipse cx="258" cy="382" rx="5" ry="3"/></g>
  <!-- babiččina chalupa s komínem -->
  <rect x="8" y="296" width="96" height="50" fill="#F2E8D2"/>
  <path d="M0 300L56 270L112 300Z" fill="#8C5A3A"/>
  <rect x="80" y="268" width="10" height="20" fill="#8C5A3A"/>
  <g fill="#9DB5C8" stroke="#8C5A3A" stroke-width="1.5"><rect x="20" y="308" width="16" height="16"/><rect x="74" y="308" width="16" height="16"/></g>
  <rect x="46" y="314" width="16" height="32" fill="#7A5A3A"/>
  <g fill="#E07A7A"><circle cx="24" cy="328" r="2.5"/><circle cx="30" cy="328" r="2.5"/><circle cx="80" cy="328" r="2.5"/><circle cx="86" cy="328" r="2.5"/></g>
  <g fill="#F2C86A"><circle cx="120" cy="372" r="3"/><circle cx="190" cy="352" r="3"/><circle cx="40" cy="380" r="3"/></g>
</svg>
