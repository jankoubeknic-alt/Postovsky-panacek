  <g fill="#E8C877"><path d="M236 146h10v4h-10zM276 146h10v4h-10z"/></g>
  <g fill="#9DB5C8" stroke="#7A3B2C" stroke-width="1.5"><rect x="234" y="150" width="14" height="14"/><rect x="274" y="150" width="14" height="14"/></g>
  <!-- ulice -->
  <path d="M126 400C130 330 136 250 140 172H160C164 250 170 330 176 400Z" fill="#E4D6B6"/>
  <!-- ploty přes celou ves -->
  <g stroke="#C9B28A" stroke-width="3">
    <path d="M0 196H126M174 196H300"/>
    <path d="M6 186v18M18 186v18M30 186v18M42 186v18M54 186v18M66 186v18M78 186v18M90 186v18M102 186v18M114 186v18"/>
    <path d="M186 186v18M198 186v18M210 186v18M222 186v18M234 186v18M246 186v18M258 186v18M270 186v18M282 186v18M294 186v18"/>
    <path d="M126 186v20M174 186v20"/>
    <path d="M0 266H120M180 266H300"/>
    <path d="M8 256v18M22 256v18M36 256v18M50 256v18M64 256v18M78 256v18M92 256v18M106 256v18"/>
    <path d="M194 256v18M208 256v18M222 256v18M236 256v18M250 256v18M264 256v18M278 256v18M292 256v18"/>
  </g>
  <!-- dílna švadleny s figurínou ve výloze -->
  <rect x="0" y="206" width="84" height="48" fill="#EFE3D2"/>
  <path d="M-4 210L42 188L88 210Z" fill="#8A6A8E"/>
  <rect x="44" y="216" width="30" height="26" fill="#C8DCE4" stroke="#8A6A8E" stroke-width="1.5"/>
  <path d="M59 220a4 4 0 1 1 0 .1M53 226h12l3 14h-18z" fill="#FBF8F1" stroke="#C9C1AE" stroke-width=".8"/>
