<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" preserveAspectRatio="xMidYMid slice">
  <!-- Zástupné pozadí Kocourkova: nahoře radnice bez oken, před ní radní s pytli světla. Vlevo Božčin dům, vpravo Pavlínin dům,
       uprostřed hospoda, vlevo pařez myslivce, vpravo žitné pole, dole statek a košíkářčin stánek. -->
  <rect width="300" height="400" fill="#E6E2D4"/>
  <path d="M0 100C80 90 220 96 300 88V400H0Z" fill="#C8CFA0"/>
  <!-- radnice bez oken -->
  <rect x="96" y="22" width="108" height="70" fill="#E9DCC4"/>
  <path d="M86 26L150 0L214 26Z" fill="#7A5A4A"/>
  <rect x="138" y="58" width="24" height="34" fill="#5A3A2A"/>
  <text x="150" y="40" font-family="Georgia, serif" font-size="7" fill="#5A3A2A" text-anchor="middle">RADNICE</text>
  <g fill="#B9A27A" stroke="#7A5A3A" stroke-width="1"><path d="M108 92c-4-14 14-14 10 0Z"/><path d="M182 92c-4-14 14-14 10 0Z"/></g>
  <g fill="#F2D86A" opacity=".7"><circle cx="113" cy="80" r="2"/><circle cx="187" cy="80" r="2"/></g>
  <!-- Božčin dům -->
  <rect x="4" y="108" width="80" height="56" fill="#E7C9A0"/>
  <path d="M0 112L44 86L88 112Z" fill="#9A4A3A"/>
  <rect x="30" y="130" width="20" height="34" fill="#6B4A3A"/>
  <!-- Pavlínin dům -->
  <rect x="216" y="108" width="80" height="56" fill="#D9C0A6"/>
  <path d="M212 112L256 86L300 112Z" fill="#6B5A7A"/>
  <rect x="246" y="130" width="20" height="34" fill="#5A3A2A"/>
  <!-- hospoda -->
  <rect x="104" y="150" width="92" height="60" fill="#EADBC0"/>
  <path d="M96 154L150 126L204 154Z" fill="#6B4A3A"/>
  <rect x="116" y="160" width="68" height="10" fill="#6B4A3A"/>
  <text x="150" y="168" font-family="Georgia, serif" font-size="6" fill="#F4F1E8" text-anchor="middle">U ČISTÉHO VÍNA</text>
  <!-- pařez -->
  <ellipse cx="48" cy="268" rx="22" ry="6" fill="#8A6A48"/>
  <rect x="26" y="252" width="44" height="16" fill="#9A7A52"/>
  <!-- žitné pole -->
  <path d="M206 220H300V290H206Z" fill="#E3C873"/>
  <g stroke="#B99A3E" stroke-width="1.2"><path d="M214 290v-60M226 290v-64M238 290v-58M250 290v-62M262 290v-60M274 290v-64M286 290v-58"/></g>
  <!-- statek -->
  <rect x="6" y="300" width="112" height="70" fill="#E3CDA6"/>
  <path d="M0 304L62 274L124 304Z" fill="#8A5A3A"/>
  <rect x="48" y="324" width="28" height="46" fill="#6B4A3A"/>
  <!-- stánek s koši -->
  <rect x="190" y="316" width="104" height="48" fill="#D9B98A"/>
  <path d="M184 318h116l-10-16H194Z" fill="#7A9A5A"/>
  <g fill="#B98A4A" stroke="#7A5A3A" stroke-width="1"><path d="M200 364c0-18 26-18 26 0Z"/><path d="M234 364c0-18 26-18 26 0Z"/><path d="M268 364c0-14 20-14 20 0Z"/></g>
</svg>
