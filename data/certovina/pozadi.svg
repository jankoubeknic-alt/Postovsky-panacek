<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" preserveAspectRatio="xMidYMid slice">
  <!-- Zástupné pozadí Čertoviny pod Kotlem: sopečné kopce, vpravo nahoře plot a zelená louka sousední farnosti,
