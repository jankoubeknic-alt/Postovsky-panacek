  <rect x="212" y="168" width="80" height="52" fill="#7A4A3E"/>
  <path d="M204 172L252 142L300 172Z" fill="#3B2622"/>
  <rect x="226" y="182" width="16" height="14" fill="#F2A23A"/>
  <rect x="224" y="196" width="20" height="5" fill="#6B4A36"/>
  <g fill="#9A7AC8"><circle cx="228" cy="193" r="2"/><circle cx="233" cy="191" r="2"/><circle cx="238" cy="193" r="2"/><circle cx="214" cy="226" r="2.5"/><circle cx="222" cy="228" r="2.5"/><circle cx="282" cy="226" r="2.5"/><circle cx="290" cy="228" r="2.5"/></g>
  <!-- kovárna a Bonifácův úl -->
  <rect x="4" y="252" width="66" height="50" fill="#6B4A3E"/>
  <path d="M0 256L37 232L74 256Z" fill="#2E1E1A"/>
