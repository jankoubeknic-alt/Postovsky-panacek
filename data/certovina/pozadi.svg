  <path d="M30 80q-6-14 2-22M66 80q6-14-2-22" fill="none" stroke="#2E1E1A" stroke-width="4" stroke-linecap="round"/>
  <rect x="58" y="118" width="14" height="14" fill="#F2A23A"/>
  <rect x="88" y="140" width="22" height="14" fill="#6B4A36"/>
  <g fill="#FFFDF4"><rect x="92" y="136" width="6" height="8"/><rect x="100" y="137" width="6" height="8"/></g>
  <!-- obecní kotel -->
  <path d="M112 236L122 186H178L188 236Z" fill="#3B332E"/>
