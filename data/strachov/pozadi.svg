<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" preserveAspectRatio="xMidYMid slice">
  <!-- Zástupné pozadí hradu Strachova v řezu: nahoře vlevo rytířský sál, vpravo kaple, uprostřed nádvoří, dole vlevo sklep, vpravo brána.
       Prohlídka (skupinka turistů) je ve vrstvách. -->
  <rect width="300" height="400" fill="#2E3446"/>
  <rect x="6" y="20" width="288" height="372" fill="#8A8478"/>
  <!-- rytířský sál -->
  <rect x="14" y="30" width="134" height="110" fill="#5A4A3E"/>
  <text x="81" y="44" font-family="Georgia, serif" font-size="7" fill="#E8DCC4" text-anchor="middle">RYTÍŘSKÝ SÁL</text>
  <path d="M30 60v70M132 60v70" stroke="#7A2A2A" stroke-width="10"/>
  <!-- kaple -->
  <rect x="152" y="30" width="134" height="110" fill="#4A4E5E"/>
  <text x="219" y="44" font-family="Georgia, serif" font-size="7" fill="#E8DCC4" text-anchor="middle">KAPLE</text>
  <path d="M206 60a13 13 0 0 1 26 0v30h-26Z" fill="#8AA6C9" opacity=".6"/>
  <!-- nádvoří -->
  <rect x="14" y="146" width="272" height="128" fill="#B9B0A0"/>
  <text x="150" y="160" font-family="Georgia, serif" font-size="7" fill="#4A4036" text-anchor="middle">NÁDVOŘÍ</text>
  <circle cx="150" cy="248" r="14" fill="#9A9488" stroke="#6B655A" stroke-width="2"/>
  <path d="M270 190h-30v-20" stroke="#6B4A2E" stroke-width="3" fill="none"/>
  <!-- sklep -->
  <rect x="14" y="280" width="168" height="104" fill="#3E342C"/>
  <text x="98" y="294" font-family="Georgia, serif" font-size="7" fill="#C9B9A0" text-anchor="middle">SKLEP</text>
  <g fill="#6B4A2E"><ellipse cx="150" cy="356" rx="16" ry="20"/><ellipse cx="114" cy="360" rx="14" ry="18"/></g>
  <!-- brána -->
  <rect x="188" y="280" width="98" height="104" fill="#6B655A"/>
  <path d="M212 384v-50a25 25 0 0 1 50 0v50Z" fill="#3A2A1E"/>
  <!-- cimbuří -->
  <g fill="#8A8478"><rect x="6" y="10" width="20" height="12"/><rect x="40" y="10" width="20" height="12"/><rect x="74" y="10" width="20" height="12"/><rect x="108" y="10" width="20" height="12"/><rect x="142" y="10" width="20" height="12"/><rect x="176" y="10" width="20" height="12"/><rect x="210" y="10" width="20" height="12"/><rect x="244" y="10" width="20" height="12"/><rect x="274" y="10" width="20" height="12"/></g>
</svg>
