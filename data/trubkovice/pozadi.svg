  <path d="M0 96H300V400H0Z" fill="#B9A27A"/>
  <path d="M0 96H300V112H0Z" fill="#9FB386"/>
  <rect x="112" y="20" width="76" height="60" fill="#F2D86A"/><path d="M104 24L150 2L196 24Z" fill="#3B5A7A"/>
  <text x="150" y="40" font-family="Georgia, serif" font-size="7" fill="#3B5A7A" text-anchor="middle">POŠTA</text>
  <g fill="none" stroke="#8A8274" stroke-width="7" stroke-linecap="round">
    <path d="M150 80V138"/><path d="M150 138L80 210"/><path d="M150 138L220 210"/>
    <path d="M80 210L42 300"/><path d="M80 210L114 310"/><path d="M220 210L186 310"/><path d="M220 210L258 300"/>
  </g>
  <g fill="none" stroke="#C9C2B4" stroke-width="3" stroke-linecap="round">
    <path d="M150 80V138"/><path d="M150 138L80 210"/><path d="M150 138L220 210"/>
    <path d="M80 210L42 300"/><path d="M80 210L114 310"/><path d="M220 210L186 310"/><path d="M220 210L258 300"/>
  </g>
  <g fill="#5A5A5A" stroke="#2E2E2E" stroke-width="1.5"><circle cx="150" cy="138" r="12"/><circle cx="80" cy="210" r="12"/><circle cx="220" cy="210" r="12"/></g>
  <g font-family="Georgia, serif" font-size="8" font-weight="700" fill="#F4F1E4" text-anchor="middle"><text x="150" y="126">A</text><text x="66" y="200">B</text><text x="234" y="200">C</text></g>
</svg>
