<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" preserveAspectRatio="xMidYMid slice">
  <!-- Zástupné pozadí Trubkovic: nahoře pošta se vhozem, pod zemí potrubí s výhybkou A, která se dělí na B (radnice a škola) a C (hospoda a fara). -->
