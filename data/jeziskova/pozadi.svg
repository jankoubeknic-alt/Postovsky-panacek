<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" preserveAspectRatio="xMidYMid slice">
  <!-- Zástupné pozadí Ježíškovy Lhoty: zasněžená ves za soumraku. Nahoře vlevo dům Pepíků, vpravo dům Anči, uprostřed kostelík,
       vlevo dole dům Toníka s babičkou, vpravo pekárna, dole velký strom na návsi. Dárky a past jsou ve vrstvách. -->
  <rect width="300" height="400" fill="#3E4E78"/>
  <g fill="#F4F1E4"><circle cx="30" cy="20" r="1.2"/><circle cx="80" cy="12" r="1"/><circle cx="130" cy="26" r="1.3"/><circle cx="190" cy="14" r="1"/><circle cx="240" cy="22" r="1.4"/><circle cx="280" cy="10" r="1"/><circle cx="160" cy="8" r="1"/></g>
  <circle cx="262" cy="42" r="10" fill="#F4E9C4"/>
  <path d="M0 96C60 84 110 90 160 82S250 78 300 88V180H0Z" fill="#5A6A8E"/>
  <path d="M0 150C70 140 130 146 190 140S270 136 300 142V400H0Z" fill="#EEF2F6"/>
  <!-- kostelík s rozsvícenými okny, hraje se betlém -->
  <rect x="122" y="66" width="56" height="40" fill="#E6E2D8"/>
  <path d="M118 68L150 50L182 68Z" fill="#F4F6F8"/>
  <rect x="142" y="30" width="16" height="38" fill="#E6E2D8"/>
  <path d="M139 32L150 14L161 32Z" fill="#F4F6F8"/>
  <path d="M150 6v8M147 9h6" stroke="#E2C46A" stroke-width="1.4"/>
  <g fill="#F2C86A"><rect x="130" y="76" width="8" height="12" rx="4"/><rect x="162" y="76" width="8" height="12" rx="4"/><rect x="146" y="40" width="8" height="10" rx="4"/></g>
  <!-- dům Pepíků s oknem -->
  <rect x="8" y="98" width="92" height="64" fill="#C9A77A"/>
  <path d="M0 102L54 72L108 102Z" fill="#F4F6F8"/>
  <rect x="36" y="108" width="36" height="30" fill="#F2C86A" stroke="#7A5A3A" stroke-width="2"/>
  <path d="M54 108v30M36 123h36" stroke="#7A5A3A" stroke-width="1.2"/>
  <path d="M46 136l8-20 8 20z" fill="#3F7A4E"/>
  <!-- dům Anči -->
  <rect x="200" y="98" width="92" height="64" fill="#B9897A"/>
  <path d="M192 102L246 72L300 102Z" fill="#F4F6F8"/>
  <rect x="228" y="108" width="36" height="30" fill="#F2C86A" stroke="#6B4A3A" stroke-width="2"/>
  <path d="M246 108v30M228 123h36" stroke="#6B4A3A" stroke-width="1.2"/>
  <path d="M238 136l8-20 8 20z" fill="#3F7A4E"/>
  <!-- dům Toníka -->
  <rect x="34" y="208" width="112" height="70" fill="#D8B48A"/>
  <path d="M26 212L90 178L154 212Z" fill="#F4F6F8"/>
  <rect x="62" y="220" width="40" height="34" fill="#F2C86A" stroke="#7A5A3A" stroke-width="2"/>
  <path d="M82 220v34M62 237h40" stroke="#7A5A3A" stroke-width="1.2"/>
  <path d="M74 252l8-22 8 22z" fill="#3F7A4E"/>
  <rect x="122" y="230" width="16" height="48" fill="#7A5A3A"/>
  <!-- pekárna -->
  <rect x="200" y="196" width="96" height="60" fill="#E8D8BE"/>
  <path d="M194 200L248 172L302 200Z" fill="#F4F6F8"/>
  <rect x="208" y="204" width="80" height="9" fill="#8C5A3A"/>
  <text x="248" y="211" font-family="Georgia, serif" font-size="5.6" fill="#F4E9C4" text-anchor="middle">PERNÍKÁŘSTVÍ</text>
  <rect x="210" y="220" width="30" height="22" fill="#F2C86A" stroke="#8C5A3A" stroke-width="1.5"/>
  <g fill="#B0703A"><circle cx="218" cy="236" r="3"/><circle cx="226" cy="234" r="3"/><circle cx="234" cy="237" r="3"/></g>
  <rect x="262" y="222" width="16" height="34" fill="#7A5A3A"/>
  <!-- cesty ve sněhu -->
  <path d="M130 400C134 340 140 300 146 270H160C166 300 172 340 176 400Z" fill="#DCE3EA"/>
  <!-- velký strom na návsi -->
  <path d="M150 292L120 336H136L112 372H188L164 336H180Z" fill="#2F6A44"/>
  <rect x="144" y="372" width="12" height="14" fill="#6B4A36"/>
  <g fill="#F4F6F8"><path d="M124 336h52l-6 4h-40zM116 372h68l-6 4h-56z"/></g>
  <!-- sníh na zemi -->
  <g fill="#FFFFFF"><circle cx="20" cy="300" r="2"/><circle cx="270" cy="300" r="2"/><circle cx="60" cy="350" r="2"/><circle cx="240" cy="360" r="2"/><circle cx="110" cy="190" r="1.6"/><circle cx="190" cy="180" r="1.6"/></g>
</svg>
