<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" preserveAspectRatio="xMidYMid slice">
  <!-- Zástupné pozadí Poštovic ve dne: nahoře pošta, vlevo pekárna u silnice, vpravo mlýn u řeky, uprostřed náves,
       vlevo škola se zahradou, vpravo hospoda u silnice, dole pastvina. Silnicí jezdí autobus. Noc je ve vrstvě. -->
  <rect width="300" height="400" fill="#DDE6EC"/>
  <path d="M0 96C80 88 220 92 300 86V400H0Z" fill="#B8CC98"/>
  <!-- silnice zleva doprava -->
  <path d="M0 196C90 186 210 186 300 196V214C210 206 90 206 0 216Z" fill="#9A948A"/>
  <path d="M10 205h20M60 202h20M110 200h20M160 200h20M210 201h20M260 203h20" stroke="#F4F1E4" stroke-width="1.5"/>
  <!-- pošta -->
  <rect x="100" y="20" width="100" height="64" fill="#F2D86A"/>
  <path d="M92 24L150 0L208 24Z" fill="#3B5A7A"/>
  <rect x="112" y="28" width="76" height="12" fill="#3B5A7A"/>
  <text x="150" y="37" font-family="Georgia, serif" font-size="7" fill="#F4F1E4" text-anchor="middle">POŠTA</text>
  <rect x="140" y="54" width="20" height="30" fill="#6B4A3A"/>
  <!-- pekárna u silnice -->
  <rect x="6" y="148" width="80" height="44" fill="#F1E3C6"/>
  <path d="M0 150L46 128L92 150Z" fill="#C98A3A"/>
  <rect x="34" y="162" width="20" height="14" fill="#BFD9E4" stroke="#6B4A3A" stroke-width="1.5"/>
  <!-- mlýn u řeky -->
  <path d="M300 100C280 140 270 170 280 186H300Z" fill="#7FA9C9"/>
  <rect x="214" y="132" width="62" height="48" fill="#C9A77A"/>
  <path d="M208 134L245 112L282 134Z" fill="#7A5A3A"/>
  <circle cx="282" cy="166" r="14" fill="none" stroke="#6B4A2E" stroke-width="3"/>
  <!-- škola se zahradou -->
  <rect x="6" y="232" width="80" height="46" fill="#EDE6D2"/>
  <path d="M0 234L46 212L92 234Z" fill="#8A3A2E"/>
  <g fill="#5E8A4A"><circle cx="20" cy="290" r="8"/><circle cx="44" cy="292" r="8"/><circle cx="68" cy="290" r="8"/></g>
  <!-- hospoda u silnice -->
  <rect x="214" y="222" width="80" height="54" fill="#E3CDA6"/>
  <path d="M208 224L254 200L300 224Z" fill="#6B4A3A"/>
  <rect x="236" y="232" width="22" height="16" fill="#BFD9E4" stroke="#6B4A3A" stroke-width="1.5"/>
  <!-- pastvina -->
  <path d="M60 400C70 360 110 340 150 340S230 360 240 400Z" fill="#A9C487"/>
  <path d="M90 352h120" stroke="#8C6A48" stroke-width="2"/>
  <!-- autobus -->
  <rect x="120" y="186" width="44" height="18" rx="4" fill="#C94A3A"/>
  <g fill="#BFD9E4"><rect x="126" y="190" width="8" height="6"/><rect x="138" y="190" width="8" height="6"/><rect x="150" y="190" width="8" height="6"/></g>
  <g fill="#3A3A3A"><circle cx="130" cy="206" r="3"/><circle cx="156" cy="206" r="3"/></g>
</svg>
