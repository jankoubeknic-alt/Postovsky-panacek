<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" preserveAspectRatio="xMidYMid slice">
  <!-- Zástupné pozadí Kašovic: nahoře chalupa s oknem, ve kterém vaří hrnec, vlevo maminka, vpravo Honza,
       uprostřed stodola s Bručounem na střeše a škola, dole hospoda U Hrnce. Kaše je ve vrstvách. -->
  <rect width="300" height="400" fill="#E2E6DA"/>
  <path d="M0 120C80 108 200 116 300 106V400H0Z" fill="#B8C79A"/>
  <!-- chalupa s hrncem -->
  <rect x="96" y="40" width="108" height="70" fill="#E9D3A8"/>
  <path d="M86 44L150 10L214 44Z" fill="#8A5A3A"/>
  <rect x="128" y="58" width="44" height="34" fill="#4A3A2E"/>
  <ellipse cx="150" cy="84" rx="18" ry="9" fill="#5A5A5A"/>
  <!-- stodola vlevo -->
  <rect x="6" y="196" width="96" height="64" fill="#B9895A"/>
  <path d="M0 200L54 164L108 200Z" fill="#7A5A3A"/>
  <rect x="38" y="220" width="32" height="40" fill="#6B4A2E"/>
  <!-- škola vpravo -->
  <rect x="198" y="196" width="96" height="64" fill="#EDE6D2"/>
  <path d="M192 200L246 168L300 200Z" fill="#8A3A2E"/>
  <rect x="206" y="206" width="80" height="10" fill="#3B4A5A"/>
  <text x="246" y="214" font-family="Georgia, serif" font-size="6" fill="#F4F1E8" text-anchor="middle">OBECNÁ ŠKOLA</text>
  <g fill="#BFD9E4" stroke="#6B4A3A" stroke-width="1.5"><rect x="212" y="224" width="18" height="16"/><rect x="262" y="224" width="18" height="16"/></g>
  <!-- hospoda -->
  <rect x="80" y="292" width="140" height="80" fill="#E8D8C0"/>
  <path d="M70 296L150 256L230 296Z" fill="#6B4A3A"/>
  <rect x="98" y="302" width="104" height="12" fill="#6B4A3A"/>
  <text x="150" y="311" font-family="Georgia, serif" font-size="7" fill="#F4F1E8" text-anchor="middle">HOSPODA U HRNCE</text>
  <rect x="136" y="330" width="28" height="42" fill="#5A3A2A"/>
</svg>
