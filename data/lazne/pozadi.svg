<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" preserveAspectRatio="xMidYMid slice">
  <!-- Zástupné pozadí Lázní Bílá: nahoře hotel s ordinací (fialky na okně), vlevo kolonáda se schránkou,
       vpravo hudební altán, uprostřed pavilon pramene, dole park s lavičkou. Postavy stojí na místech z cile.csv. -->
  <rect width="300" height="400" fill="#D3E4EA"/>
  <path d="M0 96C40 70 90 80 130 72S220 60 300 84V170H0Z" fill="#9DB8A8"/>
  <path d="M0 118C60 104 120 112 170 106S260 100 300 112V170H0Z" fill="#86A595"/>
  <g fill="#6F907F"><circle cx="16" cy="134" r="20"/><circle cx="36" cy="146" r="14"/><circle cx="284" cy="130" r="20"/><circle cx="264" cy="146" r="14"/></g>

  <!-- hotel Bílá -->
  <rect x="50" y="48" width="200" height="104" fill="#F4F1E8"/>
  <path d="M44 50L60 30H240L256 50Z" fill="#7E9AA0"/>
  <path d="M116 50L150 18L184 50Z" fill="#F4F1E8" stroke="#C9C1AE" stroke-width="1.5"/>
  <circle cx="150" cy="38" r="5" fill="#E2C46A"/>
  <rect x="50" y="50" width="200" height="11" fill="#E6DFCD"/>
  <text x="150" y="58.5" font-family="Georgia, serif" font-size="7" letter-spacing="2" fill="#6E6458" text-anchor="middle">HOTEL BÍLÁ</text>
  <g fill="#9DB5BE" stroke="#FFFFFF" stroke-width="1.5">
    <rect x="62" y="68" width="14" height="18"/><rect x="88" y="68" width="14" height="18"/><rect x="198" y="68" width="14" height="18"/><rect x="224" y="68" width="14" height="18"/>
    <rect x="62" y="102" width="14" height="18"/><rect x="88" y="102" width="14" height="18"/><rect x="224" y="102" width="14" height="18"/>
    <rect x="196" y="100" width="18" height="20"/>
  </g>
  <!-- okno ordinace s fialkami -->
  <rect x="194" y="120" width="22" height="4" fill="#C9C1AE"/>
  <g fill="#7B5BA6"><circle cx="198" cy="118" r="2.4"/><circle cx="204" cy="117" r="2.6"/><circle cx="210" cy="118" r="2.4"/></g>
  <g fill="#5E8A4E"><circle cx="201" cy="120" r="1.6"/><circle cx="207" cy="120" r="1.6"/></g>
  <g stroke="#C9C1AE" stroke-width="2"><path d="M58 92H106M194 92H242"/></g>
  <rect x="136" y="116" width="28" height="36" rx="12" fill="#8A7A66"/>

  <!-- kolonáda -->
  <rect x="0" y="170" width="192" height="80" fill="#DCD6C8"/>
  <rect x="0" y="158" width="196" height="14" fill="#F7F3EA"/>
  <path d="M0 172H196" stroke="#C9C1AE" stroke-width="2"/>
  <g fill="#FBF9F3" stroke="#D2CABA" stroke-width="1">
    <rect x="4" y="172" width="8" height="76"/><rect x="28" y="172" width="8" height="76"/><rect x="52" y="172" width="8" height="76"/>
    <rect x="76" y="172" width="8" height="76"/><rect x="100" y="172" width="8" height="76"/><rect x="124" y="172" width="8" height="76"/>
    <rect x="148" y="172" width="8" height="76"/><rect x="172" y="172" width="8" height="76"/>
  </g>
  <rect x="0" y="246" width="196" height="8" fill="#E8E0CE"/>
  <!-- schránka, kam někdo ráno házel anonymy -->
  <rect x="133" y="204" width="13" height="18" rx="3" fill="#E2A03A" stroke="#9C6A22" stroke-width="1"/>
  <rect x="135" y="208" width="9" height="2" fill="#6E4A1A"/>

  <!-- hudební altán -->
  <path d="M188 168Q243 112 298 168Z" fill="#B7D0C9"/>
  <path d="M188 168H298" stroke="#8FAFA6" stroke-width="3"/>
  <circle cx="243" cy="126" r="3" fill="#E2C46A"/>
  <g fill="#FBF9F3" stroke="#D2CABA" stroke-width="1">
    <rect x="196" y="168" width="6" height="68"/><rect x="220" y="168" width="6" height="68"/><rect x="260" y="168" width="6" height="68"/><rect x="284" y="168" width="6" height="68"/>
  </g>
  <rect x="188" y="234" width="110" height="14" fill="#D9D0BC"/>
  <path d="M188 248H298" stroke="#B9AE96" stroke-width="2"/>

  <!-- park -->
  <path d="M0 252H300V400H0Z" fill="#B4CDA5"/>
  <path d="M120 252H180L214 400H86Z" fill="#E9E0CC"/>
  <path d="M0 330C40 320 80 322 110 318L104 334C70 338 40 340 0 346Z" fill="#E9E0CC"/>
  <path d="M300 318C260 312 220 314 196 312L200 328C230 330 264 332 300 336Z" fill="#E9E0CC"/>
  <g fill="#C2564A"><circle cx="16" cy="282" r="3"/><circle cx="26" cy="290" r="3"/><circle cx="38" cy="282" r="3"/><circle cx="274" cy="278" r="3"/><circle cx="286" cy="288" r="3"/></g>
  <g fill="#7B5BA6"><circle cx="20" cy="296" r="3"/><circle cx="32" cy="300" r="3"/><circle cx="264" cy="290" r="3"/><circle cx="278" cy="296" r="3"/></g>
  <ellipse cx="28" cy="292" rx="22" ry="12" fill="none" stroke="#8DAA7E" stroke-width="2"/>
  <ellipse cx="276" cy="288" rx="22" ry="12" fill="none" stroke="#8DAA7E" stroke-width="2"/>

  <!-- pavilon pramene -->
  <path d="M120 266Q150 236 180 266Z" fill="#F4F1E8" stroke="#C9C1AE" stroke-width="1.5"/>
  <g fill="#FBF9F3" stroke="#D2CABA" stroke-width="1"><rect x="124" y="266" width="6" height="40"/><rect x="170" y="266" width="6" height="40"/></g>
  <ellipse cx="150" cy="308" rx="32" ry="7" fill="#9DC3CC" stroke="#C9C1AE" stroke-width="2"/>

  <!-- lavička plukovníka a kbelík pokojské -->
  <rect x="14" y="372" width="92" height="5" fill="#8A6A4A"/>
  <rect x="14" y="364" width="92" height="4" fill="#8A6A4A"/>
  <g fill="#5A4636"><rect x="20" y="377" width="4" height="12"/><rect x="96" y="377" width="4" height="12"/></g>
  <path d="M268 362h18l-3 18h-12z" fill="#8FA3AD"/>
  <path d="M268 362q9-10 18 0" fill="none" stroke="#5E6E76" stroke-width="1.5"/>
</svg>
