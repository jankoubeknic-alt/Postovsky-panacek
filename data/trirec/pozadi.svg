<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" preserveAspectRatio="xMidYMid slice">
  <!-- Zástupné pozadí Třířečí: nádražní restaurace s dlouhými stoly, za oknem nástupiště a tři směrovky: Haná, Valašsko, Ostrava. -->
  <rect width="300" height="400" fill="#EADBC4"/>
  <rect y="300" width="300" height="100" fill="#A7825E"/>
  <rect x="20" y="40" width="260" height="90" fill="#BFD6E8" stroke="#6E5A44" stroke-width="4"/>
  <path d="M20 115H280" stroke="#7A7A7A" stroke-width="5"/><path d="M110 40V130M190 40V130" stroke="#6E5A44" stroke-width="3"/>
  <g font-family="Georgia, serif" font-size="9" font-weight="700" fill="#4A3A2E"><rect x="34" y="60" width="62" height="16" fill="#F3EAD8"/><text x="65" y="72" text-anchor="middle">← HANÁ</text>
  <rect x="120" y="60" width="62" height="16" fill="#F3EAD8"/><text x="151" y="72" text-anchor="middle">VALAŠSKO</text>
  <rect x="200" y="60" width="66" height="16" fill="#F3EAD8"/><text x="233" y="72" text-anchor="middle">OSTRAVA →</text></g>
  <g fill="#8A6A4A"><rect x="10" y="230" width="280" height="10"/><rect x="10" y="330" width="280" height="10"/></g>
</svg>
