  <rect x="124" y="56" width="28" height="110" fill="#F0E8D4"/>
  <path d="M120 58L138 26L156 58Z" fill="#6B5A4A"/>
  <path d="M138 26V8" stroke="#4A3F33" stroke-width="2"/>
  <path d="M132 10h12l-4 4h-8z" fill="#D9A93A"/>
  <rect x="152" y="110" width="50" height="56" fill="#F0E8D4"/>
  <path d="M148 112L177 92L206 112Z" fill="#6B5A4A"/>
  <!-- mlýn na kopci -->
  <path d="M226 126L232 70H256L262 126Z" fill="#D8C7A6"/>
  <path d="M228 72L244 54L260 72Z" fill="#7A5A3A"/>
