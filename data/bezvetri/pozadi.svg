  <path d="M96 210Q156 226 216 210" fill="none" stroke="#7A6A5A" stroke-width="1.5"/>
  <g stroke="#9C7A52" stroke-width="3"><path d="M96 210v60M216 210v60"/></g>
  <g stroke="#7A6A5A" stroke-width="1"><rect x="106" y="214" width="14" height="22" fill="#C6DDF4"/><rect x="188" y="214" width="14" height="22" fill="#F4C6C6"/></g>
  <g fill="#6FA3B8"><circle cx="113" cy="242" r="1.5"/><circle cx="195" cy="242" r="1.5"/><circle cx="113" cy="250" r="1.2"/></g>
  <!-- cesta a kopec drakiády -->
  <path d="M140 400C146 340 150 290 156 250H170C172 290 184 340 196 400Z" fill="#E4D6B6"/>
  <path d="M0 300C40 280 90 290 120 320V400H0Z" fill="#B6B27A"/>
