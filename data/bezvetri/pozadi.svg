<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" preserveAspectRatio="xMidYMid slice">
  <!-- Zástupné pozadí Bezvětří: uprostřed kostel s korouhvičkou, vpravo na kopci větrný mlýn s děravými lopatkami,
       vlevo obecní úřad, uprostřed šňůra s mokrým prádlem, vlevo dole kopec drakiády. Všude bezvětří: kouř stoupá rovně. -->
  <rect width="300" height="400" fill="#E6E2C8"/>
  <path d="M0 130C60 110 120 124 180 112S260 100 300 116V400H0Z" fill="#C9C58E"/>
  <path d="M200 120C230 70 270 60 300 64V140H200Z" fill="#B6B27A"/>
