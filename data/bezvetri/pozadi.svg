  <g fill="none" stroke="#9C8A6A" stroke-width="1" stroke-dasharray="3 3"><path d="M220 42l10 10M268 44l-8 10M222 84l8-8M268 82l-8-8"/></g>
  <circle cx="244" cy="62" r="4" fill="#5A4636"/>
  <!-- obecní úřad -->
  <rect x="6" y="122" width="86" height="58" fill="#EDE3CC"/>
  <path d="M0 126L49 100L98 126Z" fill="#8C4A3A"/>
  <rect x="34" y="156" width="20" height="24" fill="#6B4A36"/>
  <text x="49" y="148" font-family="Georgia, serif" font-size="6" fill="#4A3F33" text-anchor="middle">OBECNÍ ÚŘAD</text>
  <rect x="60" y="100" width="7" height="16" fill="#7A6A5A"/>
  <path d="M63 98V70" stroke="#C9C5BC" stroke-width="5" stroke-linecap="round" opacity=".8"/>
