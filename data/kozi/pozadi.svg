<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" preserveAspectRatio="xMidYMid slice">
  <!-- Zástupné pozadí Kozího Hřbítku: nahoře škola s volební místností, vlevo obecní úřad, uprostřed urna na stole,
       vpravo Bořkova bedna s plakátem, dole sedlákovo zelí a babčina chaloupka. Na kopci se pasou kozy. -->
  <rect width="300" height="400" fill="#D4E6EC"/>
  <path d="M0 110C50 70 110 60 160 80S250 70 300 90V200H0Z" fill="#9CC08A"/>
  <g fill="#FFFFFF" stroke="#6B6B6B" stroke-width="1"><ellipse cx="60" cy="86" rx="7" ry="4"/><ellipse cx="236" cy="82" rx="7" ry="4"/><ellipse cx="270" cy="92" rx="6" ry="3.5"/></g>
  <path d="M0 150C80 136 220 140 300 150V400H0Z" fill="#B6D29E"/>
  <!-- škola -->
  <rect x="96" y="40" width="108" height="70" fill="#F0E2C4"/>
  <path d="M88 44L150 14L212 44Z" fill="#9C4A34"/>
  <rect x="112" y="96" width="76" height="12" fill="#3B5E8C"/>
  <text x="150" y="105" font-family="Georgia, serif" font-size="6.5" fill="#FFFFFF" text-anchor="middle">VOLEBNÍ MÍSTNOST</text>
  <g fill="#9DB5C8" stroke="#FFFFFF" stroke-width="1.5"><rect x="104" y="52" width="16" height="18"/><rect x="180" y="52" width="16" height="18"/></g>
  <!-- obecní úřad s vývěskou -->
  <rect x="6" y="110" width="98" height="66" fill="#E9DCC0"/>
  <path d="M0 114L55 86L110 114Z" fill="#7A5A3A"/>
  <rect x="22" y="128" width="30" height="22" fill="#8A6A4A"/>
  <g fill="#FFFDF4"><rect x="25" y="131" width="11" height="8"/><path d="M39 131h10v8h-6l-4-3z"/></g>
  <text x="55" y="168" font-family="Georgia, serif" font-size="6" fill="#4A3F33" text-anchor="middle">OBECNÍ ÚŘAD</text>
  <!-- urna na stole -->
  <rect x="118" y="196" width="64" height="8" fill="#8A6A4A"/>
  <g fill="#6B4A36"><rect x="124" y="204" width="5" height="26"/><rect x="171" y="204" width="5" height="26"/></g>
  <!-- Bořkova bedna a plakát -->
  <rect x="216" y="186" width="48" height="28" fill="#B08A5A" stroke="#7A5A3A" stroke-width="1.5"/>
  <path d="M216 200h48" stroke="#7A5A3A" stroke-width="1"/>
  <rect x="262" y="118" width="34" height="44" fill="#FFF5C8" stroke="#7A5A3A" stroke-width="1.5"/>
  <text x="279" y="134" font-family="Georgia, serif" font-size="6" font-weight="700" fill="#2E6B3A" text-anchor="middle">JETEL</text>
  <text x="279" y="143" font-family="Georgia, serif" font-size="5" fill="#2E6B3A" text-anchor="middle">PRO</text>
  <text x="279" y="152" font-family="Georgia, serif" font-size="6" font-weight="700" fill="#2E6B3A" text-anchor="middle">VŠECHNY</text>
  <path d="M279 162v20" stroke="#7A5A3A" stroke-width="2"/>
  <!-- cesta -->
  <path d="M130 400C136 330 140 270 146 230H156C160 270 170 330 182 400Z" fill="#E4D6B6"/>
  <!-- sedlákovo pole se zelím -->
  <path d="M0 260H110V340H0Z" fill="#8FAE6A"/>
  <g fill="#6E9A4E"><circle cx="14" cy="276" r="7"/><circle cx="34" cy="280" r="7"/><circle cx="96" cy="276" r="7"/><circle cx="14" cy="330" r="7"/><circle cx="96" cy="330" r="7"/></g>
  <g fill="#A8CC82"><circle cx="14" cy="276" r="4"/><circle cx="34" cy="280" r="4"/><circle cx="96" cy="276" r="4"/><circle cx="14" cy="330" r="4"/><circle cx="96" cy="330" r="4"/></g>
  <!-- babčina chaloupka -->
  <rect x="196" y="250" width="98" height="70" fill="#F2ECDD"/>
  <path d="M188 254L245 222L302 254Z" fill="#7A5A3A"/>
  <g fill="#9DB5C8" stroke="#7A5A3A" stroke-width="1.5"><rect x="206" y="266" width="16" height="16"/><rect x="270" y="266" width="16" height="16"/></g>
  <g fill="#FFFFFF" opacity=".8"><path d="M206 266h16v6h-16z"/><path d="M270 266h16v6h-16z"/></g>
  <rect x="204" y="330" width="80" height="6" fill="#8A6A4A"/>
  <!-- kytky -->
  <g fill="#E07A7A"><circle cx="130" cy="372" r="3"/><circle cx="200" cy="380" r="3"/><circle cx="60" cy="378" r="3"/></g>
  <g fill="#F2C86A"><circle cx="110" cy="384" r="3"/><circle cx="250" cy="372" r="3"/></g>
</svg>
